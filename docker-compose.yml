# ServiceSphere — local infrastructure stack
# Usage: copy .env.docker.example → .env.docker, then:
#   docker compose --env-file .env.docker up -d
#
# Or use the npm scripts at the repo root:
#   npm run infra:up   / infra:down / infra:logs / infra:nuke

services:

  # ─────────────────────────────────────────
  # MongoDB 7
  # ─────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: ss_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # ping works without auth — even on auth-enabled instances
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────
  # Redis 7 (Alpine)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ss_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # appendonly yes persists data to disk
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    environment:
      # Expose password to the healthcheck shell
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────
  # Meilisearch v1.10
  # ─────────────────────────────────────────
  meili:
    image: getmeili/meilisearch:v1.10
    container_name: ss_meili
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # 'development' enables the Meilisearch web dashboard at :7700
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health | grep -q '\"status\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────
  # Express API server
  # ─────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ss_server
    restart: unless-stopped
    # Port 5000 is NOT exposed to the host — nginx proxies /api/ internally.
    # Uncomment the line below only if you need direct API access for debugging:
    # ports:
    #   - "5001:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_DB_NAME:-jahnavipro}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEILI_HOST: http://meili:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      SEARCH_DRIVER: ${SEARCH_DRIVER:-meili}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      meili:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────
  # React SPA (Vite build → nginx)
  # ─────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ss_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy

# ─────────────────────────────────────────
# Named volumes (survive container restarts)
# ─────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
  meili_data:
    driver: local
